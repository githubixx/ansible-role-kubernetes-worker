- name: Verify worker services and artifacts
  hosts: k8s_worker
  remote_user: vagrant
  become: true
  gather_facts: true
  vars:
    mol__expected_release: "{{ k8s_worker_release | default(mol__role_defaults.k8s_worker_release) }}"
    mol__conf_dir: "{{ k8s_worker_conf_dir | default('/etc/kubernetes/worker') }}"
    mol__bin_dir: "{{ k8s_worker_bin_dir | default('/usr/local/bin') }}"
    mol__pki_dir: "{{ k8s_worker_pki_dir | default(mol__conf_dir + '/pki') }}"
    mol__kubelet_dir: "{{ k8s_worker_kubelet_conf_dir | default(mol__conf_dir + '/kubelet') }}"
    mol__kubeproxy_dir: "{{ k8s_worker_kubeproxy_conf_dir | default(mol__conf_dir + '/kube-proxy') }}"
    mol__expected_proxy_config: "{{ k8s_worker_kubeproxy_conf_yaml | default(mol__role_defaults.k8s_worker_kubeproxy_conf_yaml) | from_yaml }}"
    mol__expected_proxy_mode: "{{ mol__expected_proxy_config.get('mode', 'iptables') }}"
    mol__worker_required_files:
      - path: /etc/systemd/system/kubelet.service
        mode: "0644"
      - path: /etc/systemd/system/kube-proxy.service
        mode: "0644"
      - path: "{{ mol__kubelet_dir }}/kubelet-config.yaml"
        mode: "0600"
      - path: "{{ mol__kubeproxy_dir }}/kubeproxy-config.yaml"
        mode: "0600"
      - path: "{{ mol__kubelet_dir }}/kubeconfig"
        mode: "0640"
      - path: "{{ mol__kubeproxy_dir }}/kubeconfig"
        mode: "0640"
      - path: "{{ mol__bin_dir }}/kubelet"
        mode: "0755"
      - path: "{{ mol__bin_dir }}/kube-proxy"
        mode: "0755"
      - path: "{{ mol__bin_dir }}/kubectl"
        mode: "0755"
    mol__worker_pki_files:
      - ca-k8s-apiserver.pem
      - ca-k8s-apiserver-key.pem
      - cert-k8s-apiserver.pem
      - cert-k8s-apiserver-key.pem
      - cert-k8s-proxy.pem
      - cert-k8s-proxy-key.pem
      - "cert-{{ inventory_hostname }}.pem"
      - "cert-{{ inventory_hostname }}-key.pem"
  tasks:
    - name: Load worker defaults for standalone verification
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml
        name: mol__role_defaults

    - name: Check worker dependencies after converge
      ansible.builtin.include_tasks:
        file: tasks/dependency_readiness.yml

    - name: Ensure worker services are running and enabled
      ansible.builtin.assert:
        that:
          - item in ansible_facts.services
          - ansible_facts.services[item].state == 'running'
          - ansible_facts.services[item].status == 'enabled'
        fail_msg: "{{ item }} must be running and enabled on {{ inventory_hostname }}."
      loop:
        - kubelet.service
        - kube-proxy.service

    - name: Gather required file metadata
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ mol__worker_required_files }}"
      register: mol__worker_file_stats

    - name: Ensure worker artifacts exist with expected ownership and permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
          - item.stat.mode == item.item.mode
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
        fail_msg: "Invalid worker artifact: {{ item.item.path }}"
      loop: "{{ mol__worker_file_stats.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Gather worker PKI metadata
      ansible.builtin.stat:
        path: "{{ mol__pki_dir }}/{{ item }}"
      loop: "{{ mol__worker_pki_files }}"
      register: mol__worker_pki_stats

    - name: Ensure worker certificates and keys are root-owned and not world-readable
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
          - item.stat.mode == '0640'
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
        fail_msg: "Invalid worker PKI file: {{ item.item }}"
      loop: "{{ mol__worker_pki_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read worker systemd units
      ansible.builtin.slurp:
        src: "/etc/systemd/system/{{ item }}.service"
      loop:
        - kubelet
        - kube-proxy
      register: mol__worker_units

    - name: Ensure systemd units use role-managed configuration paths
      ansible.builtin.assert:
        that:
          - "'--config=' + mol__kubelet_dir + '/kubelet-config.yaml' in (mol__worker_units.results[0].content | b64decode)"
          - "'--kubeconfig=' + mol__kubelet_dir + '/kubeconfig' in (mol__worker_units.results[0].content | b64decode)"
          - "'--config=' + mol__kubeproxy_dir + '/kubeproxy-config.yaml' in (mol__worker_units.results[1].content | b64decode)"

    - name: Read kube-proxy configuration
      ansible.builtin.slurp:
        src: "{{ mol__kubeproxy_dir }}/kubeproxy-config.yaml"
      register: mol__kubeproxy_config_raw

    - name: Read kubelet configuration
      ansible.builtin.slurp:
        src: "{{ mol__kubelet_dir }}/kubelet-config.yaml"
      register: mol__kubelet_config_raw

    - name: Parse worker configuration
      ansible.builtin.set_fact:
        mol__kubeproxy_config: "{{ mol__kubeproxy_config_raw.content | b64decode | from_yaml }}"
        mol__kubelet_config: "{{ mol__kubelet_config_raw.content | b64decode | from_yaml }}"

    - name: Ensure kubelet authentication and runtime configuration are applied
      ansible.builtin.assert:
        that:
          - mol__kubelet_config.kind == 'KubeletConfiguration'
          - mol__kubelet_config.apiVersion == 'kubelet.config.k8s.io/v1beta1'
          - not mol__kubelet_config.authentication.anonymous.enabled
          - mol__kubelet_config.authentication.webhook.enabled
          - mol__kubelet_config.authorization.mode == 'Webhook'
          - mol__kubelet_config.authentication.x509.clientCAFile == mol__pki_dir + '/ca-k8s-apiserver.pem'
          - mol__kubelet_config.healthzPort == 10248
          - mol__kubelet_config.containerRuntimeEndpoint == 'unix:///run/containerd/containerd.sock'
          - mol__kubelet_config.cgroupDriver == 'systemd'
          - mol__kubelet_config.tlsCertFile == mol__pki_dir + '/cert-' + inventory_hostname + '.pem'
          - mol__kubelet_config.tlsPrivateKeyFile == mol__pki_dir + '/cert-' + inventory_hostname + '-key.pem'

    - name: Ensure kube-proxy configuration uses the requested backend
      ansible.builtin.assert:
        that:
          - mol__kubeproxy_config.kind == 'KubeProxyConfiguration'
          - mol__kubeproxy_config.apiVersion == 'kubeproxy.config.k8s.io/v1alpha1'
          - mol__kubeproxy_config.clientConnection.kubeconfig == mol__kubeproxy_dir + '/kubeconfig'
          - mol__kubeproxy_config.mode == mol__expected_proxy_mode

    - name: Ensure nftables applies the requested networking settings
      when: mol__expected_proxy_mode == 'nftables'
      ansible.builtin.assert:
        that:
          - (mol__kubeproxy_config.nftables.masqueradeAll | default(false)) == (mol__expected_proxy_config.nftables.masqueradeAll | default(false))
          - mol__kubeproxy_config.get('nodePortAddresses', []) == mol__expected_proxy_config.get('nodePortAddresses', [])
          - >-
            mol__kubeproxy_config.get('nftables', {}).get('minSyncPeriod')
            == mol__expected_proxy_config.get('nftables', {}).get('minSyncPeriod')
          - >-
            mol__kubeproxy_config.get('nftables', {}).get('syncPeriod')
            == mol__expected_proxy_config.get('nftables', {}).get('syncPeriod')

    - name: Read active kube-proxy nftables rules
      when: mol__expected_proxy_mode == 'nftables'
      ansible.builtin.command: nft --json list table ip kube-proxy
      register: mol__nft_rules
      changed_when: false

    - name: Ensure kube-proxy programmed nftables rules
      when: mol__expected_proxy_mode == 'nftables'
      ansible.builtin.assert:
        that:
          - (mol__nft_rules.stdout | from_json).nftables | selectattr('rule', 'defined') | list | length > 0
        fail_msg: "No kube-proxy nftables rules on {{ inventory_hostname }}."

    - name: Read active IPVS services when explicitly selected
      when: mol__expected_proxy_mode == 'ipvs'
      ansible.builtin.slurp:
        src: /proc/net/ip_vs
      register: mol__ipvs_services

    - name: Ensure kube-proxy programmed IPVS services
      when: mol__expected_proxy_mode == 'ipvs'
      ansible.builtin.assert:
        that:
          - (mol__ipvs_services.content | b64decode) is search('(?m)^TCP\\s')
        fail_msg: "No TCP IPVS services on {{ inventory_hostname }}."

    - name: Check kubelet secure listener
      ansible.builtin.wait_for:
        host: "{{ mol__kubelet_config.address }}"
        port: 10250
        timeout: 30

    - name: Check kubelet health endpoint
      ansible.builtin.uri:
        url: "http://{{ mol__kubelet_config.healthzBindAddress }}:{{ mol__kubelet_config.healthzPort }}/healthz"
        return_content: true
        use_proxy: false
      register: mol__kubelet_health
      failed_when: mol__kubelet_health.status != 200 or mol__kubelet_health.content | trim != 'ok'

    - name: Check kube-proxy health endpoint
      ansible.builtin.uri:
        url: "http://{{ mol__kubeproxy_config.healthzBindAddress }}/healthz"
        return_content: true
        use_proxy: false
      register: mol__kubeproxy_health
      failed_when: >-
        mol__kubeproxy_health.status != 200 or
        mol__kubeproxy_health.json is not defined or
        mol__kubeproxy_health.json is not mapping or
        mol__kubeproxy_health.json.healthy is not defined or
        mol__kubeproxy_health.json.healthy is not true

    - name: Read worker component versions
      ansible.builtin.command:
        argv:
          - "{{ mol__bin_dir }}/{{ item }}"
          - --version
      loop:
        - kubelet
        - kube-proxy
      register: mol__worker_version
      changed_when: false
      failed_when: mol__worker_version.rc != 0 or mol__worker_version.stdout | trim != 'Kubernetes v' + mol__expected_release

    - name: Read kubectl client version
      ansible.builtin.command:
        argv:
          - "{{ mol__bin_dir }}/kubectl"
          - version
          - --client
          - --output=json
      register: mol__kubectl_version
      changed_when: false

    - name: Ensure kubectl matches the requested release
      ansible.builtin.assert:
        that:
          - (mol__kubectl_version.stdout | from_json).clientVersion.gitVersion == 'v' + mol__expected_release

- name: Verify worker API access and service networking
  hosts: test-assets
  remote_user: vagrant
  become: false
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ k8s_admin_conf_dir }}/admin.kubeconfig"
  vars:
    mol__role_defaults: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../defaults/main.yml') | from_yaml }}"
    mol__expected_release: "{{ k8s_worker_release | default(mol__role_defaults.k8s_worker_release) }}"
    mol__kubectl: "kubectl --kubeconfig={{ k8s_admin_conf_dir }}/admin.kubeconfig"
    mol__expected_corefile: |
      .:53 {
          errors
          health {
            lameduck 5s
          }
          kubernetes {{ coredns_cluster_domain }} in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
          }
          prometheus :9153
          forward . {{ coredns_upstreams | join(' ') }}
          cache 30
          loop
          reload
          loadbalance
          ready
      }
  tasks:
    - name: Check API readiness after worker converge
      ansible.builtin.command: "{{ mol__kubectl }} get --raw=/readyz"
      register: mol__api_ready
      changed_when: false
      failed_when: mol__api_ready.rc != 0 or mol__api_ready.stdout | trim != 'ok'

    - name: Fetch cluster namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
      register: mol__namespaces

    - name: Ensure the standard cluster namespaces exist
      ansible.builtin.assert:
        that:
          - "['default', 'kube-system', 'kube-public', 'kube-node-lease'] | difference(mol__namespaces.resources | map(attribute='metadata.name') | list) | length == 0"

    - name: Fetch registered nodes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: mol__nodes

    - name: Ensure all expected workers are registered
      ansible.builtin.assert:
        that:
          - groups['k8s_worker'] | difference(mol__nodes.resources | map(attribute='metadata.name') | list) | length == 0

    - name: Ensure worker nodes are Ready and running the requested kubelet release
      ansible.builtin.assert:
        that:
          - item.status.nodeInfo.kubeletVersion == 'v' + mol__expected_release
          - item.status.conditions | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list == ['True']
        fail_msg: "Worker {{ item.metadata.name }} must be Ready at v{{ mol__expected_release }}."
      loop: "{{ mol__nodes.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: item.metadata.name in groups['k8s_worker']

    - name: Fetch kube-apiserver kubelet authorization role
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        name: system:kube-apiserver-to-kubelet
      register: mol__kubelet_role

    - name: Ensure fine-grained kubelet permissions exist
      ansible.builtin.assert:
        that:
          - mol__kubelet_role.resources | length == 1
          - item in (mol__kubelet_role.resources[0].rules | selectattr('apiGroups', 'equalto', ['']) | selectattr('verbs', 'contains', '*') | map(attribute='resources') | flatten)
        fail_msg: "The controller role must grant kube-apiserver access to {{ item }}."
      loop:
        - nodes/proxy
        - nodes/pods
        - nodes/healthz
        - nodes/configz

    - name: Fetch kube-apiserver kubelet authorization binding
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: system:kube-apiserver
      register: mol__kubelet_binding

    - name: Ensure the API server identity is bound to the kubelet role
      ansible.builtin.assert:
        that:
          - mol__kubelet_binding.resources | length == 1
          - mol__kubelet_binding.resources[0].roleRef.kind == 'ClusterRole'
          - mol__kubelet_binding.resources[0].roleRef.name == 'system:kube-apiserver-to-kubelet'
          - mol__kubelet_binding.resources[0].subjects | selectattr('kind', 'equalto', 'User') | selectattr('name', 'equalto', k8s_apiserver_csr_cn) | list | length == 1

    - name: Check API server access to each kubelet health endpoint
      ansible.builtin.command: "{{ mol__kubectl }} get --raw=/api/v1/nodes/{{ item }}/proxy/healthz"
      loop: "{{ groups['k8s_worker'] }}"
      register: mol__proxied_health
      changed_when: false
      failed_when: mol__proxied_health.rc != 0 or mol__proxied_health.stdout | trim != 'ok'

    - name: Read Cilium configuration
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: cilium
        name: cilium-config
      register: mol__cilium_config

    - name: Ensure Cilium does not bypass kube-proxy
      ansible.builtin.assert:
        that:
          - mol__cilium_config.resources | length == 1
          - mol__cilium_config.resources[0].data['kube-proxy-replacement'] == 'false'
          - mol__cilium_config.resources[0].data['bpf-lb-sock'] == 'false'

    - name: Fetch networking dependency readiness
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      loop:
        - {api_version: apps/v1, kind: DaemonSet, namespace: cilium, name: cilium}
        - {api_version: apps/v1, kind: Deployment, namespace: kube-system, name: coredns}
      register: mol__network_workloads

    - name: Ensure Cilium is ready on every worker and CoreDNS is available
      ansible.builtin.assert:
        that:
          - mol__network_workloads.results[0].resources | length == 1
          - mol__network_workloads.results[0].resources[0].status.desiredNumberScheduled == groups['k8s_worker'] | length
          - mol__network_workloads.results[0].resources[0].status.numberReady == groups['k8s_worker'] | length
          - mol__network_workloads.results[1].resources | length == 1
          - mol__network_workloads.results[1].resources[0].status.availableReplicas == mol__network_workloads.results[1].resources[0].spec.replicas

    - name: Fetch CoreDNS configuration and DNS Service
      kubernetes.core.k8s_info:
        api_version: v1
        kind: "{{ item.kind }}"
        namespace: kube-system
        name: "{{ item.name }}"
      loop:
        - {kind: ConfigMap, name: coredns}
        - {kind: Service, name: kube-dns}
      register: mol__dns_resources

    - name: Ensure role-managed CoreDNS preserves the scenario DNS configuration
      ansible.builtin.assert:
        that:
          - mol__network_workloads.results[1].resources[0].metadata.annotations['githubixx.github.io/coredns-role'] == 'true'
          - mol__network_workloads.results[1].resources[0].metadata.annotations['meta.helm.sh/release-name'] == 'coredns'
          - mol__dns_resources.results[0].resources | length == 1
          - mol__dns_resources.results[1].resources | length == 1
          - mol__dns_resources.results[1].resources[0].spec.clusterIP == coredns_service_ip
          - >-
            mol__dns_resources.results[1].resources[0].spec.ports
            | selectattr('port', 'equalto', 53) | map(attribute='protocol') | sort | list == ['TCP', 'UDP']
          - >-
            mol__dns_resources.results[0].resources[0].data.Corefile | regex_replace('\s+', ' ') | trim
            == mol__expected_corefile | regex_replace('\s+', ' ') | trim
        fail_msg: CoreDNS must be role-managed and retain the scenario's DNS Service and Corefile.

    - name: Fetch the smoke-test service
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        namespace: "{{ mol__smoke_namespace }}"
        name: "{{ mol__smoke_app_name }}"
      register: mol__smoke_service

    - name: Require the converged NodePort fixture
      ansible.builtin.assert:
        that:
          - mol__smoke_service.resources | length == 1
          - mol__smoke_service.resources[0].spec.type == 'NodePort'
          - mol__smoke_service.resources[0].spec.ports[0].nodePort == mol__smoke_node_port
        fail_msg: >-
          Expected the smoke-test Service to use NodePort {{ mol__smoke_node_port }};
          observed Service ports: {{ mol__smoke_service.resources | map(attribute='spec.ports') | list }}.
          Rerun converge after changing smoke-test settings.

    - name: Fetch smoke-test client pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ mol__smoke_namespace }}"
        label_selectors:
          - app=smoke-client
      register: mol__smoke_clients

    - name: Require a running client on every dedicated worker
      ansible.builtin.assert:
        that:
          - mol__dedicated_workers | length >= 2
          - mol__smoke_clients.resources | length == mol__dedicated_workers | length
          - mol__smoke_clients.resources | map(attribute='spec.nodeName') | sort == mol__dedicated_workers
          - mol__smoke_clients.resources | map(attribute='status.phase') | unique | list == ['Running']

    - name: Check ClusterIP and DNS traffic from each worker through kubelet exec streaming
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ k8s_admin_conf_dir }}/admin.kubeconfig"
          - -n
          - "{{ mol__smoke_namespace }}"
          - exec
          - "{{ item.0.metadata.name }}"
          - --
          - wget
          - -q
          - -O
          - "-"
          - -T
          - "10"
          - "http://{{ item.1 }}"
      loop: "{{ mol__smoke_clients.resources | product(mol__smoke_targets) | list }}"
      loop_control:
        label: "{{ item.0.spec.nodeName }} -> {{ item.1 }}"
      vars:
        mol__smoke_targets:
          - "{{ mol__smoke_service.resources[0].spec.clusterIP }}"
          - "{{ mol__smoke_app_name }}.{{ mol__smoke_namespace }}.svc.cluster.local"
      register: mol__smoke_http
      changed_when: false
      failed_when: mol__smoke_http.rc != 0 or 'Welcome to nginx!' not in mol__smoke_http.stdout

    - name: Check NodePort traffic on each worker primary address
      ansible.builtin.uri:
        url: "http://{{ (item.status.addresses | selectattr('type', 'equalto', 'InternalIP') | first).address }}:{{ mol__smoke_node_port }}"
        return_content: true
        use_proxy: false
      loop: "{{ mol__nodes.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: item.metadata.name in groups['k8s_worker']
      register: mol__nodeport_http
      failed_when: mol__nodeport_http.status != 200 or 'Welcome to nginx!' not in mol__nodeport_http.content
