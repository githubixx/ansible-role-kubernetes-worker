- name: Update cache
  hosts: k8s
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

- name: Harden hosts
  hosts: all
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup harden_linux role
      ansible.builtin.include_role:
        name: githubixx.harden_linux

- name: Setup Wireguard VPN
  hosts: vpn
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup wireguard role
      ansible.builtin.include_role:
        name: githubixx.ansible_role_wireguard

- name: Setup cfssl
  hosts: k8s_assets
  become: true
  gather_facts: false
  tasks:
    - name: Install cfssl
      ansible.builtin.include_role:
        name: githubixx.cfssl

- name: Setup Kubernetes certificates
  hosts: k8s_assets
  gather_facts: false
  tasks:
    - name: Generate etcd and K8s TLS certificates
      ansible.builtin.include_role:
        name: githubixx.kubernetes_ca

    - name: Copy certificate files from assets to local host
      ansible.posix.synchronize:
        mode: pull
        src: "{{ k8s_ca_conf_directory }}"
        dest: "/tmp"

- name: Setup etcd
  hosts: k8s_etcd
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Include etcd role
      ansible.builtin.include_role:
        name: githubixx.etcd

- name: Setup Kubernetes client tooling
  hosts: k8s_assets
  become: true
  gather_facts: true
  tasks:
    - name: Install kubectl
      ansible.builtin.include_role:
        name: githubixx.kubectl

    - name: Install support packages
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - conntrack
          - git
          - python3-pip

    - name: Install kubernetes Python package
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Install Helm role
      ansible.builtin.include_role:
        name: gantsign.helm

    - name: Install Helm diff plugin for the execution user
      become: false
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        plugin_version: v3.14.0
        state: present
      vars:
        ansible_become: false

- name: Setup HAProxy
  hosts: haproxy
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup haproxy role
      ansible.builtin.include_role:
        name: githubixx.haproxy

- name: Setup containerd
  hosts: k8s_worker
  become: true
  gather_facts: true
  tasks:
    - name: Include runc role
      ansible.builtin.include_role:
        name: githubixx.runc

    - name: Include CNI role
      ansible.builtin.include_role:
        name: githubixx.cni

    - name: Include containerd role
      ansible.builtin.include_role:
        name: githubixx.containerd

- name: Setup Kubernetes controller
  hosts: k8s_controller
  become: true
  gather_facts: true
  tasks:
    - name: Include kubernetes_controller role
      ansible.builtin.include_role:
        name: githubixx.kubernetes_controller

- name: Prepare kubeconfig for vagrant user
  hosts: k8s_assets
  become: true
  gather_facts: false
  vars:
    k8s_controller__vagrant_kube_directory: "/home/vagrant/.kube"
  tasks:
    - name: Ensure .kube directory in vagrant home
      ansible.builtin.file:
        path: "{{ k8s_controller__vagrant_kube_directory }}"
        state: directory
        mode: "0700"
        owner: "vagrant"
        group: "vagrant"

    - name: Link admin.kubeconfig in the vagrant home directory
      ansible.builtin.file:
        src: "{{ k8s_admin_conf_dir }}/admin.kubeconfig"
        dest: "{{ k8s_controller__vagrant_kube_directory }}/config"
        state: link
        follow: false
        owner: "vagrant"
        group: "vagrant"

    - name: Check API readiness before worker converge
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ k8s_admin_conf_dir }}/admin.kubeconfig"
          - get
          - --raw=/readyz
      register: mol__api_ready
      changed_when: false
      retries: 12
      delay: 5
      until: mol__api_ready.rc == 0 and mol__api_ready.stdout | trim == 'ok'
      failed_when: mol__api_ready.rc != 0 or mol__api_ready.stdout | trim != 'ok'
